<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book an Appointment | Hospital Y</title><meta name="description" content="Book a hospital appointment online."><link rel="stylesheet" href="css/style.css"></head>
<body data-p="booking"><div id="hdr"></div><main id="main" tabindex="-1">
<section class="wrap"><h1>Book an appointment</h1><form id="bf" novalidate>
<label for="sp">1. Specialty</label><select id="sp"></select><label for="dc">Doctor</label><select id="dc"></select>
<label for="dt">2. Date</label><input id="dt" type="date"><label id="tl">Time</label><div class="row" id="sl" role="group" aria-labelledby="tl"></div>
<label for="nm">3. Full name</label><input id="nm" autocomplete="name"><label for="ph">Phone</label><input id="ph" inputmode="numeric" autocomplete="tel"><label for="em">E-mail (optional)</label><input id="em" type="email">
<p class="err" id="e" role="alert"></p><button class="btn t">4. Confirm appointment</button></form><div id="done" class="ok" hidden tabindex="-1"></div></section>
</main><footer id="ftr"></footer><script src="js/app.js"></script></body></html>
